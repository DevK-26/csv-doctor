# CSV Doctor — production stack for Oracle Cloud VM
# Why this shape: one small VM runs everything. Caddy is the only public
# door (auto-HTTPS when a domain is set, plain HTTP on IP otherwise).
# Web and engine are internal only — they can't be hit directly from outside.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - engine

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Browser calls /api/* on the same domain; Caddy proxies it to engine.
      NEXT_PUBLIC_API_BASE: /api
    expose:
      - "3000"

  engine:
    build:
      context: ./services/engine
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
    expose:
      - "7860"
    depends_on:
      - redis
    # Future (Blueprint T5): Celery worker uses this same image.
    # It is NOT started yet because the engine has no Celery tasks yet —
    # do not claim async jobs exist until that code lands.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"

volumes:
  caddy_data:
  caddy_config:
  redis_data:

# CSV Doctor model router — FREE TIERS ONLY.
# The summary layer calls lanes in order until one answers.
# Every call is logged (model_calls table) and cached by file hash,
# so a repeat upload costs 0 calls. Caps checked Oct-Nov 2026 — re-check monthly.
lanes:
  - id: groq-8b
    provider: groq
    model: llama-3.1-8b-instant
    role: summary            # default: explains the facts pack
    daily_cap: 14400
  - id: groq-70b
    provider: groq
    model: llama-3.3-70b-versatile
    role: deep-summary       # only when user clicks "Deep dive"
    daily_cap: 1000
  - id: or-free
    provider: openrouter
    model: openrouter/free
    role: fallback
    daily_cap: 50
rules:
  - cache-by-file-hash       # sha256(file bytes + engine_version)
  - 8b-first
  - log-every-call
  - stop-at-cap-and-degrade  # report ships without summary if all lanes are capped
